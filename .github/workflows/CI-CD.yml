name: CI/CD - Test and Deploy to Render

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check all Python files
        run: |
          python -m py_compile $(find app -name "*.py")

      - name: Verify Dockerfile exists
        run: test -f Dockerfile

      - name: Verify requirements.txt exists
        run: test -f requirements.txt

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"